name: Daily Redfin Scrape

on:
  schedule:
    # Runs at 06:00 UTC every day (approx 1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Restore Redfin cookies
        env:
          REDFIN_COOKIES_JSON: ${{ secrets.REDFIN_COOKIES_JSON }}
        run: |
          if [ -n "$REDFIN_COOKIES_JSON" ]; then
            printf '%s' "$REDFIN_COOKIES_JSON" > app/Redfin/chrome_cookies.json
          else
            echo "No REDFIN_COOKIES_JSON secret set; continuing without cookies."
          fi

      - name: Discover New Properties
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          python app/Redfin/get_properties.py

      - name: Extract (fetch pages into bronze)
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          # Cap per scheduled run so it always finishes; locally the default is "all pending".
          MAX_SCRAPE_COUNT: 300
        run: |
          python app/Redfin/scrape_properties_prod.py

      - name: Transform (bronze to silver)
        # Also runs when extract stopped early, so pages already saved still reach silver.
        if: always()
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        run: |
          python app/Redfin/transform_silver.py --incremental --out-prefix silver
